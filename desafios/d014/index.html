<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
        }

        table {
            border-collapse: collapse;
            border: 1px solid black;
        }

        th, td {
            padding: 10px;
            border: 1px solid black;
        }

        th {
            background-color: #3838388c;
            color: white;
        }

        td {
            text-align: center;
        }

        td.matemática {
            text-align: justify;
        }

        td.fisica {
            text-align: justify;
        }

        td.quimica {
            text-align: justify;
        }

        td.biologia {
            text-align: justify;
        }

        td.historia {
            text-align: justify;
        }

        td.geografia {
            text-align: justify;
        }

        th.exatas {
            background-color: white;
            
        }

        th.humanas {
            background-color: white;
        }

        th.mediaex {
            text-align: justify;
        }
    </style>
</head>
<body>
    <table>
        <thead>
            <tr>
                <th rowspan="2" scope="col">Àrea</th>
                <th rowspan="2" scope="col">Disciplinas</th>
                <th colspan="2" scope="colgroup">Notas</th>
                <th rowspan="2" scope="col">Média</th>
            </tr>
            <tr>        
                <th scope="col">Nota1</th>
                <th scope="col">Nota 2</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <th rowspan="4" scope="rowgroup" class="exatas" style=" color: black;">Exatas</th>
                <td class="matemática">Matemática</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
               
                <td class="fisica">Física</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td>
            </tr>
            <tr>
                <td class="quimica">Química</td>
                <td>0.0</td>
                <td>0.0</td>
                <td>0.0</td> 
            </tr>
            <tr>
               <td class="biologia">Biologia</td>
               <td>0.0</td>
               <td>0.0</td>
               <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row" class="mediaex">Média de Exatas</th>
                <td style="background-color: #3838388c; color: white; font-weight: bold;">0.0</td>
            </tr>
            <tr>
               <th rowspan="2" scope="rowgroup" class="humanas" style="color: black;">Humanas</th>
               <td class="historia">História</td>
               <td>0.0</td>
               <td>0.0</td>
               <td>0.0</td> 
            </tr>
            <tr>
              <td class="geografia">Geografia</td>
              <td>0.0</td>
              <td>0.0</td>
              <td>0.0</td>
            </tr>
            <tr>
                <th colspan="4" scope="row">Média de Humanas</th>
                <td style="background-color: #3838388c; color: white; font-weight: bold;">0.0</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
